<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ringleader Dashboard</title>
  <meta name="theme-color" content="#0B0B0C">
  <!-- Lets the owner "Add to Home Screen" and open it like an app, with its own icon. -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ringleader">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="fx.css?v=25">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <!-- Top bar. On phones the menu moves to the bottom of the screen. -->
    <header class="bar">
      <a class="logo" href="#overview" aria-label="Ringleader home">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        </span>
        <span class="logo-text">Ringleader</span>
      </a>
      <span class="biz" id="biz-name">Business</span>

      <nav class="nav" aria-label="Dashboard">
        <a href="#overview" data-page="overview" title="Today (press 1)" aria-keyshortcuts="1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Today
        </a>
        <a href="#conversations" data-page="conversations" title="Texts (press 2)" aria-keyshortcuts="2">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Texts<span class="count" id="waiting-count"></span>
        </a>
        <a href="#autotext" data-page="autotext" title="Settings (press 3)" aria-keyshortcuts="3">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings
        </a>
        <a href="#frontdesk" data-page="frontdesk" title="Next up (press 4)" aria-keyshortcuts="4">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Next up
        </a>
      </nav>

      <button type="button" class="cmdk-btn" data-cmdk aria-label="Open the command menu" aria-keyshortcuts="Meta+K Control+K">Jump to<kbd>⌘K</kbd></button>
      <span class="mode" id="side-foot"></span>
    </header>

    <!-- app.js draws the current page in here -->
    <main class="main" id="main" aria-busy="true">
      <!-- What shows for the moment before the numbers arrive. The shapes match the real page. -->
      <div class="skel" aria-hidden="true">
        <i class="skel-kicker"></i>
        <i class="skel-title"></i>
        <i class="skel-money"></i>
        <i class="skel-line"></i>
        <i class="skel-band"></i>
        <div class="skel-grid"><i></i><i></i><i></i></div>
        <i class="skel-card"></i>
      </div>
    </main>
  </div>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <script src="data.js?v=3"></script>
  <script src="app.js?v=17"></script>
  <script src="fx.js?v=6"></script>
</body>
</html>
